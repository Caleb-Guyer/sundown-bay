<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122d32">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318323c'/%3E%3Ccircle cx='19' cy='13' r='8' fill='%23ffad79'/%3E%3Cpath d='M0 22 Q8 17 16 22 T32 22 V32 H0Z' fill='%238fdccb'/%3E%3C/svg%3E">
  <title>Sundown Bay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="Sundown Bay open-city game">
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="world" aria-label="Street view"></canvas>
    <canvas id="overhead" aria-label="Overhead city view" hidden></canvas>
    <canvas id="rain" aria-hidden="true" hidden></canvas>
    <canvas id="motoDash" aria-hidden="true" hidden></canvas>
    <div id="motoFinder" hidden aria-label="Coast Camera rangefinder"><span class="filmGate"></span><span class="filmMeter" id="motoRead"></span></div>
    <aside id="fotoFinder" hidden aria-label="Foto Bahía live viewfinder"><header><strong>Foto Bahía</strong><span id="fotoCounter"></span></header><div class="foto-glass"><canvas id="fotoPortrait" width="340" height="207" aria-label="Your pose in the booth"></canvas><b id="fotoClock"></b></div><div class="foto-poses"><button data-pose="0">1 · Straight</button><button data-pose="1">2 · Lean in</button><button data-pose="2">3 · Peace</button></div><small>E to leave the booth</small></aside>
    <canvas id="palmGuide" aria-hidden="true" hidden></canvas>
    <canvas id="scoutFinder" aria-label="Frankie’s location finder" hidden></canvas>
    <canvas id="driverGlass" aria-hidden="true" hidden></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <section id="hud" aria-label="Game dashboard" hidden>
      <div class="location"><span class="area-kicker">SUNDOWN BAY <time id="cityTime"></time></span><strong id="district">Ocean Drive</strong><span id="streetName" hidden></span></div>
      <aside id="receiverCard" aria-label="Car radio" hidden>
        <canvas id="radioScale" width="480" height="80" aria-hidden="true"></canvas>
        <small id="receiverStation"></small><strong id="receiverTitle"></strong><span id="receiverCredit"></span><p id="receiverWire" hidden></p>
      </aside>
      <section id="boothReadout" aria-label="Sol FM mixing desk" hidden>
        <div class="sleeve-names"><span><i>A</i> <b id="boothA"></b></span><span><i>B</i> <b id="boothB"></b></span></div>
        <canvas id="boothMeter" width="680" height="176" aria-label="Outgoing and incoming beat lights and crossfader"></canvas>
        <strong id="boothStatus"></strong><small id="boothTip"></small>
      </section>
      <section id="potReadout" aria-label="Buttonwood deck gauge" hidden>
        <span id="potName"></span><strong id="potStatus"></strong><small id="potGaugeLabel"></small>
        <div id="potLoad" role="meter" aria-label="Deck gauge" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      </section>
      <section id="brisasReadout" aria-label="Las Brisas switch box" hidden>
        <canvas width="104" height="65" id="brisasMeter" aria-hidden="true"></canvas>
        <div><small id="brisasLabel"></small><strong id="brisasCall"></strong><span id="brisasValue"></span></div>
      </section>
      <section id="palmReadout" aria-label="Palm Diner house table" hidden>
        <div class="palm-score"><strong id="palmTurn"></strong><span id="palmLine"></span><small id="palmStatus"></small></div>
        <div class="palm-input"><div id="palmPower" role="meter" aria-label="Shot power" aria-valuemin="0" aria-valuemax="100"><i></i></div><span id="palmHelp"></span></div>
      </section>
      <div class="account"><strong id="money">$0</strong><span id="stars" aria-label="No heat"></span>
        <div id="pursuitStatus" hidden><span id="pursuitLabel"></span><i aria-hidden="true"></i></div>
        <span id="blockCall" class="dispatch-call" hidden></span><span id="airCall" class="dispatch-call" hidden></span>
      </div>
      <button id="miniButton" class="radar" title="Open city map (M)" aria-label="Open city map"><canvas id="mini" width="200" height="200"></canvas><span class="north">N</span><span class="map-key">M</span></button>
      <div id="objective" hidden><span id="objectiveTag"></span><b id="objectiveText"></b><small id="roadTurn"></small>
        <div id="ferryMeter" role="progressbar" aria-label="Steady alongside the ferry" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div></div>
      <div id="regattaHud" aria-label="Breakwater Run race timing" hidden>
        <div class="race-head"><strong id="raceCourse"></strong><b id="racePlace"></b></div>
        <div class="race-time"><strong id="raceTime"></strong><span id="raceGate"></span></div>
        <div class="race-course-line"><i id="raceArrow" aria-hidden="true">↑</i><span id="raceGuide"></span></div>
      </div>
      <div id="raceStart" role="status" aria-live="polite" hidden></div>
      <div id="neonTester" hidden aria-label="Marlin five-contact sign tester">
        <div class="neon-ticket"><b>Marlin Neon Service</b><span id="neonCount"></span></div>
        <div class="neon-strip" aria-hidden="true"><i id="tube0">M</i><i id="tube1">O</i><i id="tube2">T</i><i id="tube3">E</i><i id="tube4">L</i><em id="neonShoe"></em></div>
        <div class="neon-meter" aria-hidden="true"><i id="neonWarm"></i></div>
        <strong id="neonTask"></strong>
      </div>
      <div id="transitCard" hidden aria-label="Route 6 trip">
        <div class="route-ticket"><b>6</b><strong>Ocean Loop</strong><span id="busDuty"></span></div>
        <div class="route-stops" aria-hidden="true"><i id="rs0">Marlin</i><i id="rs1">Mercado</i><i id="rs2">Port Sol</i><i id="rs3">Luna</i></div>
        <strong id="busCall"></strong><small id="busDetail"></small>
      </div>
      <section id="airTicket" aria-label="Pelican Air flight" hidden>
        <div><b>Pelican Air</b><span id="airRole"></span></div><strong id="airLeg"></strong><small id="airGuide"></small>
        <canvas id="airInstruments" width="432" height="102" aria-label="Airspeed, altitude, heading and throttle"></canvas>
      </section>
      <section id="skateTicket" hidden aria-label="Skate line">
        <div><b id="skateHeading"></b><span id="skateState"></span></div>
        <strong id="skateTrick"></strong><small id="skateCall"></small>
        <i id="skateBalance" hidden aria-label="Board balance"><em></em></i>
      </section>
      <div id="meetFinder" aria-hidden="true" hidden><span id="filmRoll"></span><i></i></div>
      <div id="micSight" aria-hidden="true" hidden></div>
      <div id="fieldHud" hidden aria-label="Directional field recorder">
        <div class="recorder-head"><small>SOL FM · FIELD UNIT 2</small><b id="fieldRoll">STBY</b></div>
        <strong id="fieldName"></strong><div class="recorder-scale"><i id="fieldNeedle"></i></div>
        <span id="fieldAim"></span><div class="tape-motion"><i id="fieldLength"></i></div>
      </div>
      <div id="fieldRadio" hidden><small>SOL FM · THE MARSH LINE</small><strong id="fieldCredit"></strong><canvas id="airWave" width="156" height="25"></canvas></div>
      <div id="diveGauge" hidden><small>BREAKWATER BAY</small><span id="swimDepth"></span><div class="air-track" role="meter" aria-label="Air remaining" aria-valuemin="0" aria-valuemax="100"><i id="swimAir"></i></div><b id="airLabel"></b></div>
      <div id="watchCall" hidden><span class="watch-pennant" aria-hidden="true"></span><div><small>SOL BEACH PATROL</small><b id="watchMessage"></b></div></div>
      <section id="courtHud" aria-label="Pickup basketball" hidden>
        <strong id="courtRules"></strong>
        <div class="court-score"><span id="courtLeft"></span><b id="courtDigits"></b><span id="courtRight"></span></div>
        <p id="courtCall"></p>
        <div id="shotMeter" aria-label="Shot release timing" hidden><i></i><b></b></div>
      </section>
      <div id="takeHud" aria-label="One Good Take" hidden>
        <div class="take-slate"><strong id="takeName"></strong><span id="takeNumber"></span></div>
        <b id="takeAction"></b><span id="takeCue"></span>
      </div>
      <div id="dashHud" aria-label="Low Tide Dash timing" hidden>
        <div class="dash-heading">Low Tide Dash <span id="dashCount"></span></div>
        <div class="dash-clock"><strong id="dashTime">0:00.00</strong><span id="dashBest"></span></div>
        <div class="dash-guide"><i id="dashBearing" aria-hidden="true" hidden></i><span id="dashLine"></span></div><div id="dashSplit" aria-live="polite"></div>
        <button id="dashRetry" hidden><kbd>T</kbd> <span>Run again</span></button>
      </div>
      <section id="bandHud" aria-label="Drum part" hidden>
        <div class="band-track"><b id="bandName"></b><span id="bandBar"></span></div>
        <canvas id="bandRoll" width="620" height="104" aria-label="Drum cues move toward the white line. A is kick, S is snare and D is hi-hat."></canvas>
        <div class="band-readout"><span id="bandPhrase"></span><span id="bandChain"></span></div>
      </section>
      <div id="context" role="status"></div>
      <div id="speech" role="status" aria-live="polite" hidden><strong></strong><span></span></div>
      <div class="vehicle"><span id="tireCall" hidden></span><span id="mode"></span><strong id="speed"></strong></div>
      <div class="shortcuts"><button id="jobKey"><kbd>J</kbd> Jobs</button><button id="dialKey" title="Previous or next station with [ or ]" hidden><kbd>]</kbd> FM dial</button><button id="audioKey"><kbd>R</kbd> <span>Sound off</span></button><button id="pauseKey" aria-label="Pause and controls"><kbd>Esc</kbd> Pause</button></div>
      <div id="targetTag" hidden></div>
      <div id="toast" role="status" aria-live="polite" hidden><span></span><b></b></div>
    </section>
    <section id="intro" class="intro" aria-labelledby="title">
      <div class="intro-inner">
        <h1 id="title"><img src="wordmark.svg" alt="Sundown Bay"></h1>
        <button id="play" class="primary" type="button" autofocus>Play</button>
      </div>
    </section>
    <template id="marinaSheet">
      <div class="club-chart"><canvas width="720" height="190" aria-label="Chart of the selected race course"></canvas><p><strong class="chart-course"></strong><span class="chart-distance"></span></p></div>
      <div class="club-course"><label for="clubCourse">Race course</label><select id="clubCourse"></select></div>
      <fieldset class="hull-field"><legend>Choose your boat</legend><div class="hull-list"></div></fieldset>
      <div class="club-entry"><span class="club-record"></span><div><button class="club-cruise">Free cruise</button><button class="club-race"></button></div></div>
      <p class="club-controls"><kbd>W / S</kbd> Throttle / reverse &nbsp; <kbd>A / D</kbd> Steer &nbsp; <kbd>Space</kbd> Trim for speed</p>
    </template>
    <template id="exposureCamera">
      <div class="finder-body">
        <div class="finder-strip"><strong>VEGA / 35</strong><span>COLOR NEG. &nbsp; 24 EXP.</span></div>
        <div class="finder-frame"><canvas width="960" height="540" tabindex="0" aria-label="Viewfinder. Aim at the red Lot 14 sign by clicking it or using the arrow keys. Press Space to take the photo."></canvas><i class="finder-cross" aria-hidden="true"></i></div>
        <div class="finder-footer"><span class="finder-status" role="status">Frame the red Lot 14 sign.</span><button class="shutter">Take photo <kbd>Space</kbd></button></div>
      </div><p class="finder-help">Click the sign to focus, or use the arrow keys.</p>
    </template>
    <template id="exposureProof">
      <figure class="contact-proof"><canvas width="768" height="432" aria-label="Mara Vega’s photograph of the Lot 14 sale notice at Port Sol"></canvas><figcaption>M. VEGA &nbsp; / &nbsp; PORT SOL <span>14A ▸</span></figcaption></figure>
    </template>
    <div id="shade" hidden></div>
    <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
      <div class="panel-head"><div><div id="panelKicker" class="eyebrow"></div><h2 id="panelTitle"></h2></div><button id="closePanel" aria-label="Close panel">Close <kbd>Esc</kbd></button></div>
      <div id="panelBody"></div>
    </section>
    <template id="shopNav">
      <nav class="shop-nav" aria-label="Garage services"><button type="button" value="upgrades">Upgrades</button><button type="button" value="respray">Respray</button></nav>
    </template>
    <template id="partsTicket">
      <div class="parts-car"><strong class="parts-model"></strong><span>Wallet <b class="parts-wallet"></b></span></div>
      <div class="parts-list"></div><p class="parts-receipt" role="status" tabindex="-1"></p>
    </template>
    <template id="paintTicket">
      <div class="paint-proof">
        <div class="paint-details"><strong class="paint-model"></strong><span class="paint-caption" aria-live="polite"></span></div>
        <canvas width="480" height="216" aria-hidden="true"></canvas>
      </div>
      <fieldset class="paint-deck"><legend>Choose a color</legend><div class="paint-options"></div></fieldset>
      <div class="paint-checkout">
        <div>Wallet <strong class="paint-wallet"></strong></div>
        <button type="button" class="paint-buy"></button>
      </div>
      <p class="paint-balance" role="status"></p>
    </template>
    <noscript>This game needs JavaScript turned on in your browser.</noscript>
  </main>
