name: Compare city drives
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Earlier game revision
        required: true
        default: a344662dc784d57e0384ba4d97569786496caea6
  push:
    branches: [main]
    paths: [.github/workflows/compare-drives.yml, render.js, atlas.js, player-motion.js, street-space.js]
permissions:
  contents: read
jobs:
  drive:
    name: Compare ${{ matrix.view }} drives on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        view: [street, overhead]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline || github.event.before }}
          path: baseline-release
          persist-credentials: false
      - name: Earlier, current, current, earlier
        env:
          VIEW: ${{ matrix.view }}
        run: |
          node .github/playtests/live.cjs "$VIEW" --compare-drive --baseline
          node .github/playtests/live.cjs "$VIEW" --compare-drive
          node .github/playtests/live.cjs "$VIEW" --compare-drive
          node .github/playtests/live.cjs "$VIEW" --compare-drive --baseline
          cat "$RUNNER_TEMP/bay-drives.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compared-${{ matrix.view }}
          path: ${{ runner.temp }}/bay-drives.jsonl
          retention-days: 7
