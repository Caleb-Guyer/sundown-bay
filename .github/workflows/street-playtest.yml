name: Street playtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - sundown.js
      - .github/playtests/**
      - .github/workflows/street-playtest.yml

permissions:
  contents: read

jobs:
  five-speed:
    name: Race the five-speed in ${{ matrix.view }} view
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        view: [street, overhead]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --mouse-look
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --beat-wake --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --press-run --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --feature-print --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --on-green --manual --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --boulevard --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --one-wheel --frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-speed-${{ matrix.view }}
          path: .github/playtests/curb-wire-proof/*.jpg
          retention-days: 3
          if-no-files-found: ignore
  rescue:
    name: Follow Rescue 4 in ${{ matrix.view }} view
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        view: [street, overhead]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --admission --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --clean-through --frames
      - if: ${{ !cancelled() }}
        run: node .github/playtests/live.cjs ${{ matrix.view }} --partner-drive --cheap-seats --frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-4-${{ matrix.view }}
          path: .github/playtests/curb-wire-proof/*.jpg
          retention-days: 3
          if-no-files-found: ignore
  encounters:
    name: Play Last Collection and street action in ${{ matrix.view }} view
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        view: [street, overhead]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.view == 'street'
        run: |
          node .github/playtests/city-update.cjs
          node .github/playtests/stream-update.cjs
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --street-action --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --foot-pursuit --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --last-seen --frames
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --walk-home --frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-action-${{ matrix.view }}
          path: .github/playtests/curb-wire-proof/*.jpg
          retention-days: 3
          if-no-files-found: ignore
  play:
    name: Play Public Record in ${{ matrix.view }} view
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        view: [street, overhead]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node .github/playtests/live.cjs ${{ matrix.view }} --public-record --frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-playtest-${{ matrix.view }}
          path: .github/playtests/curb-wire-proof/*.jpg
          retention-days: 3
          if-no-files-found: ignore
